# Builds Fern.exe and update.exe and publishes them as a GitHub release when a
# version tag is pushed:
#
#   git tag v2.1
#   git push origin v2.1
#
# The tag (without the "v") is baked into Fern as its version, which is what
# the in-app update check compares against the latest release. The tag's
# section in CHANGELOG.md ("## v2.1 - Name") becomes the release notes and
# title; a tag without one fails before anything is built.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Fern/go.mod

      - name: Check the tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not like v2.1 or v2.1.3"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Read the changelog entry
        run: |
          if ! name=$(.github/scripts/changelog.sh name "$GITHUB_REF_NAME"); then
            echo "::error file=CHANGELOG.md::No '## $GITHUB_REF_NAME' section. Add one (or rename Unreleased) before tagging."
            exit 1
          fi
          .github/scripts/changelog.sh notes "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::The $GITHUB_REF_NAME section is empty."
            exit 1
          fi
          title="Fern $VERSION"
          if [ -n "$name" ]; then title="$title - $name"; fi
          echo "TITLE=$title" >> "$GITHUB_ENV"

      # The WebView package needs cgo. Use the runner's MinGW if it has one.
      - name: Make sure gcc is available
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Vet and test
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./Fern/... ./update/...
          go test ./Fern/... ./update/...

      # Fern/Fern.syso (icon and manifest) is committed, so windres isn't needed.
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-H windowsgui -X main.appVersion=$VERSION" -o Fern.exe ./Fern
          go build -ldflags "-H windowsgui" -o update.exe ./update

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Fern.exe update.exe \
            --title "$TITLE" \
            --notes-file release-notes.md
