# Builds Fern.exe and update.exe and publishes them as a GitHub release when a
# version tag is pushed:
#
#   git tag v2.1
#   git push origin v2.1
#
# The tag (without the "v") is baked into Fern as its version, which is what
# the in-app update check compares against the latest release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: Fern/go.mod

      - name: Check the tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not like v2.1 or v2.1.3"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The WebView package needs cgo. Use the runner's MinGW if it has one.
      - name: Make sure gcc is available
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Vet and test
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./Fern/... ./update/...
          go test ./Fern/... ./update/...

      # Fern/Fern.syso (icon and manifest) is committed, so windres isn't needed.
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          go build -ldflags "-H windowsgui -X main.appVersion=$VERSION" -o Fern.exe ./Fern
          go build -ldflags "-H windowsgui" -o update.exe ./update

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Fern.exe update.exe \
            --title "Fern $VERSION" \
            --generate-notes
