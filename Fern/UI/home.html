<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Fern Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            transition: background-color 0.3s, color 0.3s;
        }

        ::selection {
            background-color: white;
            color: #7751a2;
        }

        .preview-box {
            background-color: #262626;
            padding: 15px;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            word-wrap: break-word;
            overflow-wrap: break-word;
            overflow-y: auto;
        }

        .text {
            height: 90%;
            width: 100%;
            text-align: center;
            margin-top: 0.25rem;
            color: #c2c1c1;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        ::-webkit-scrollbar {
            background: none;
        }
        .text::-webkit-scrollbar {
            background: none;
        }
        .Logs-Box {
            height: 40vh;
            background-color: #262626;
            padding: 15px;
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            word-wrap: break-word;
            overflow-wrap: break-word;
            overflow-y: hidden;
        }

        .Logs-Box::-webkit-scrollbar {
            display: none;
        }

        .Logs-Box {
            scrollbar-width: none;
        }



        input[type="checkbox"] {
            display: none;
        }

        .toggle-wrapper {
            margin-bottom: -0.28rem;
            display: inline-block;
            width: 50px;
            height: 20px;
            background-color: #444;
            border-radius: 50px;
            position: relative;
            cursor: pointer;
        }

        .toggle-wrapper::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background-color: #c0c0c0;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        input[type="checkbox"]:checked + .toggle-wrapper::before {
            transform: translateX(30px);
            background-color: #c0c0c0;
        }

        .toggle-wrapper {
            background-color: #444;
        }

        input[type="checkbox"]:checked + .toggle-wrapper {
            background-color: #6b6b6b;
        }
        aside {
            height: 100vh;
        }
        @media (max-width: 600px) {
            aside {
                display: none;
                position: absolute;
                left: -100%;
            }
        }
    </style>
</head>

<body>
<div>

    <div class="flex flex-1">
        <aside class="w-1/4 bg-[#1a1a1a] p-5 flex flex-col" style="overflow-y: scroll; padding-right: 0; width: 275px;">
            <h3 class="text-[#7751a2] p-2 text-xl mb-6 font-bold text-center bg-[#262626] rounded-lg"
                style="box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);">
                Fern
            </h3>

            <div class="preview-box mt-2" style="overflow: visible;">
                <h4 class="flex justify-between items-center">
                    <a href="https://github.com/KyarottoOwO" target="_blank">
                        <i class="fab fa-github text-[#7751a2]"
                           style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6); width: 52px;"></i>
                    </a>
                    <span class="text-[#7751a2] font-bold text-center"
                          style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);">Preview</span>
                    <span class="text-[#7751a2] text-sm" id="DisplayC" style="width: 52px; text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);"></span>
                </h4>
                <div class="separator my-2 border-t border-[#444]"></div>
                <div class="text" id="PreViewText" style="height: 100%;">
                </div>
            </div>

            <div id="menuContainer" class="mt-[2rem]" style="overflow-y: visible"></div>
        </aside>

        <main class="flex-1 p-5" id="mainContent">
            <div class="bg-[#1e1e1e] p-4 rounded-lg shadow-md">
                Ha how did you get here?
            </div>
        </main>
    </div>
</div>

<script>
    const menuItems = [
        {
            "Dashboard": [
                {
                    text: 'Display',
                    href: '#',
                    active: true,
                    content: `
    <div class="menu-container bg-[#1e1e1e] p-5 rounded-lg shadow-lg">

        <p class="text-[#c2c1c1] mb-4">Customize how the ChatBox displays information.</p>

        <div class="grid grid-cols-2 gap-4 mb-4">

                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="ShowSwitch" class="sr-only peer"  onclick="SetDisplay('ChangeShowOptions')">

                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">Media</span>

                </label>

        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">Loading</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="LoadingSwitch" class="sr-only peer" onclick="SetDisplay('ChangeLoadingOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">

                    <input type="checkbox" id="TimeSwitch" class="sr-only peer" onclick="SetDisplay('ChangeTimeOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">Afk</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="AfkSwitch" class="sr-only peer" onclick="SetDisplay('ChangeAfkOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">Text</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="TextSwitch" class="sr-only peer" onclick="SetDisplay('ChangeTextOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">Memory</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="MemorySwitch" class="sr-only peer" onclick="SetDisplay('ChangeMemoryOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">ActiveWindow</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="ActiveWindowSwitch" class="sr-only peer" onclick="SetDisplay('ChangeActiveWindowOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">CPU</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="CPUSwitch" class="sr-only peer" onclick="SetDisplay('ChangeCPUOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>

            <div class="flex items-center justify-between bg-[#262626] p-3 rounded-lg shadow">
                <span class="text-lg text-[#c2c1c1]">VRChat Logs</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="VRChatLogsSwitch" class="sr-only peer" onclick="SetDisplay('ChangeVRChatLogsOptions')">
                    <div class="w-11 h-6 bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-5 peer-checked:after:border-white after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#7751a2]"></div>
                </label>
            </div>
        </div>
    </div>
    `
                },
                {
                    text: 'Logs',
                    href: '#',
                    active: false,
                    content: `<div class="grid-container" style="display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, auto); gap: 16px; padding: 0; justify-self: center; width: 100%; height: 100%;">
                    <div class="Logs-Box">
                        <h4 class="flex justify-between items-center">
                            <div class="flex items-center"></div>
                            <a class="text-[#7751a2] font-bold text-center"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);">Join Logs</a>
                            <span class="text-[#7751a2] text-sm"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);"></span>
                        </h4>
                        <div class="separator my-2 border-t border-[#444]"></div>
                        <div class="text" id="JoinLogsText">Loading join logs...</div>
                    </div>

                    <div class="Logs-Box">
                        <h4 class="flex justify-between items-center">
                            <div class="flex items-center"></div>
                            <span class="text-[#7751a2] font-bold text-center"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);">Leave Logs</span>
                            <span class="text-[#7751a2] text-sm"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);"></span>
                        </h4>
                        <div class="separator my-2 border-t border-[#444]"></div>
                        <div class="text" id="LeaveLogsText">Loading leave logs...</div>
                    </div>

                    <div class="Logs-Box">
                        <h4 class="flex justify-between items-center">
                            <div class="flex items-center"></div>
                            <span class="text-[#7751a2] font-bold text-center"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);">Chat Logs</span>
                            <span class="text-[#7751a2] text-sm"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);"></span>
                        </h4>
                        <div class="separator my-2 border-t border-[#444]"></div>
                        <div class="text" id="ChatLogsText">Loading chat logs...</div>
                    </div>

                    <div class="Logs-Box">
                        <h4 class="flex justify-between items-center">
                            <div class="flex items-center"></div>
                            <span class="text-[#7751a2] font-bold text-center"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);">Error Logs</span>
                            <span class="text-[#7751a2] text-sm"
                                style="text-shadow: 0 5px 10px rgba(0, 0, 0, 0.6);"></span>
                        </h4>
                        <div class="separator my-2 border-t border-[#444]"></div>
                        <div class="text" id="ErrorLogsText">Loading error logs...</div>
                    </div>
                </div>`
                }
            ]
        },
        {
            "Settings": [
                {
                    text: 'Toggles Options',
                    href: '#',
                    active: false,
                    content: `
                        <h2 class="text-2xl font-semibold mb-4">Toggles Options</h2>
                        <p>Manage your toggle settings here.</p>
                        <label>
                            <span class="mb-8 text-[#ddd]">Afk now</span>
                            <input type="checkbox" id="afk-toggle">
                            <div class="toggle-wrapper"></div>
                        </label>
                    `
                },
                {
                    text: 'Text Options',
                    href: '#',
                    active: false,
                    content: `
                        <h2 class="text-2xl font-semibold mb-4">Text Options</h2>
                        <p>Customize your text settings.</p>
                        <div class="mt-4">
                            <input type="text" class="px-3 py-2 rounded bg-[#2a2a2a] text-white" placeholder="Enter text here"/>
                        </div>
                    `
                }
            ]
        }
    ];


    const menuContainer = document.getElementById('menuContainer');
    const mainContent = document.getElementById('mainContent');

    function renderMenu() {
        menuContainer.innerHTML = "";

        menuItems.forEach(sectionObj => {
            const sectionName = Object.keys(sectionObj)[0];
            const itemsArray = sectionObj[sectionName];

            const sectionDiv = document.createElement('div');
            sectionDiv.classList.add("mb-4");

            const sectionTitle = document.createElement('h4');
            sectionTitle.textContent = sectionName;
            sectionTitle.classList.add("text-[#7751a2]", "mb-2", "tew", "font-semibold");
            sectionDiv.appendChild(sectionTitle);

            itemsArray.forEach(item => {
                const button = document.createElement('button');
                button.classList.add(
                    'w-full',
                    'text-left',
                    'cursor-pointer',
                    'rounded-lg',
                    'p-3',
                    'mb-2',
                    'transition-colors',
                    'duration-300',
                    'focus:outline-none',
                    'shadow-xl'
                );

                if (item.active) {
                    button.classList.add('bg-[#7751a2]');
                } else {
                    button.classList.add('bg-[#262626]', 'hover:bg-[w]');
                }

                button.textContent = item.text;

                button.addEventListener('click', () => {
                    menuItems.forEach(secObj => {
                        const secKey = Object.keys(secObj)[0];
                        secObj[secKey].forEach(i => i.active = false);
                    });

                    item.active = true;
                    renderMenu();
                    mainContent.innerHTML = item.content;

                    const GetJoinLogs = document.getElementById("JoinLogsText");
                    if (GetJoinLogs) {
                        startGetJoinLogs(GetJoinLogs);
                    }

                    const GetModules = document.getElementById("LoadingSwitch");
                    if (GetModules) {
                        StartGetModules();
                    }

                    const GetLeaveLogs = document.getElementById("LeaveLogsText");
                    if (GetLeaveLogs) {
                        startGetLeaveLogs(GetLeaveLogs);
                    }
                });

                sectionDiv.appendChild(button);
            });

            menuContainer.appendChild(sectionDiv);
        });
    }

    const PreView = document.getElementById('PreViewText');
    const DisplayCLimit = document.getElementById("DisplayC");
    function StartGetModules() {
        const ws = new WebSocket("/ws/modules");
        ws.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                console.log("Received:", message);

                Object.keys(message).forEach(key => {
                    const switchElement = document.getElementById(`${key}Switch`);
                    if (switchElement) {
                        switchElement.checked = message[key];

                        if (!switchElement.dataset.listenerAttached) {
                            switchElement.addEventListener("change", () => {
                                console.log(key, switchElement.checked)
                            });
                            switchElement.dataset.listenerAttached = "true";
                        }
                    } else {
                        console.warn(`Element #${key}Switch not found`);
                    }
                });

            } catch (error) {
                console.error(error);
            }
        };
    }



    function startPreviewUpdate() {
        const ws = new WebSocket("/ws/preview")
        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            PreView.innerHTML = message;
            DisplayCLimit.textContent = `${message.length}/144`;
        }
    }

    function startGetJoinLogs(GetJoinLogs) {
        const ws = new WebSocket("/ws/logs/join")
        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.length > 0 && GetJoinLogs.innerHTML.includes("Loading join logs...")) {
                GetJoinLogs.innerHTML = ""
            }
            GetJoinLogs.innerHTML = message + "\n" +GetJoinLogs.innerHTML
        }
    }

    function startGetLeaveLogs(GetJoinLogs) {
        const ws = new WebSocket("/ws/logs/leave")
        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.length > 0 && GetJoinLogs.innerHTML.includes("Loading leave logs...")) {
                GetJoinLogs.innerHTML = ""
            }
            GetJoinLogs.innerHTML = message + "\n" + GetJoinLogs.innerHTML
        }
    }

    startPreviewUpdate();
    renderMenu();

    menuItems[0].Dashboard[0].active = true;
    mainContent.innerHTML = menuItems[0].Dashboard[0].content;

    StartGetModules();

    menuItems.forEach(sectionObj => {
        const sectionName = Object.keys(sectionObj)[0];
        sectionObj[sectionName].forEach(item => {
            item.active = item.text === "VRChatLogs";
        });
    });


    function SetDisplay(Display) {
        const ws = new WebSocket("/ws/console");
        ws.onopen = function() {
            console.log("WebSocket Opened");
            const message = { text: Display };
            ws.send(JSON.stringify(message));
        };
    }
</script>
</body>
</html>
