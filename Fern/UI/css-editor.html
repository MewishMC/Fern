<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fern · Custom CSS</title>
    <!-- This window never loads the theme or the custom CSS it edits, so a rule
         that breaks the panel cannot hide the editor needed to fix it. -->
    <style>
        :root {
            --hue: 268;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            background: #141218;
            color: #ece9f1;
            font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .hint {
            margin: 0;
            color: #9a94a6;
            font-size: 12px;
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            padding: 10px 12px;
            resize: none;
            color: inherit;
            background: #0d0c10;
            border: 1px solid #2c2834;
            border-radius: 8px;
            font: 12.5px/1.55 "Cascadia Mono", Consolas, ui-monospace, monospace;
            tab-size: 4;
        }

        textarea:focus {
            outline: none;
            border-color: hsl(var(--hue) 70% 65%);
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #status {
            color: #9a94a6;
            font-size: 12px;
        }

        button {
            padding: 6px 14px;
            color: inherit;
            background: #221f29;
            border: 1px solid #3a3544;
            border-radius: 7px;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            border-color: hsl(var(--hue) 70% 65%);
        }
    </style>
</head>

<body>
    <header>
        <h1>Custom CSS</h1>
        <p class="hint">Applied to the panel as you type</p>
    </header>
    <textarea id="editor" spellcheck="false" placeholder=".card { border-radius: 6px; }"></textarea>
    <footer>
        <span id="status">Saved</span>
        <button type="button" id="clear">Clear</button>
    </footer>

    <script>
        "use strict";
        // The panel listens for changes to this key and applies them live.
        const KEY = "fern_custom_css";
        const editor = document.getElementById("editor");
        const status = document.getElementById("status");

        try {
            const hue = localStorage.getItem("fern_accent_hue");
            if (hue !== null) document.documentElement.style.setProperty("--hue", hue);
            editor.value = localStorage.getItem(KEY) || "";
        } catch (e) { }

        function save() {
            try {
                localStorage.setItem(KEY, editor.value);
                status.textContent = "Saved";
            } catch (e) {
                status.textContent = "Could not save: storage is full";
            }
        }

        let timer = null;
        editor.addEventListener("input", () => {
            status.textContent = "Editing…";
            clearTimeout(timer);
            timer = setTimeout(save, 250);
        });

        // Tab indents instead of leaving the editor.
        editor.addEventListener("keydown", (ev) => {
            if (ev.key !== "Tab" || ev.shiftKey || ev.ctrlKey || ev.altKey) return;
            ev.preventDefault();
            editor.setRangeText("    ", editor.selectionStart, editor.selectionEnd, "end");
            editor.dispatchEvent(new Event("input"));
        });

        document.getElementById("clear").addEventListener("click", () => {
            editor.value = "";
            clearTimeout(timer);
            save();
            editor.focus();
        });

        // The panel can clear the CSS too (Ctrl+Shift+Alt+C); keep this window in step.
        window.addEventListener("storage", (ev) => {
            if (ev.key === KEY && ev.newValue !== editor.value) editor.value = ev.newValue || "";
        });

        window.addEventListener("beforeunload", () => {
            if (timer) save();
        });
        editor.focus();
    </script>
</body>

</html>
