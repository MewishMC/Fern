<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fern · Custom CSS</title>
    <!-- The panel's own theme is safe to load here. The custom CSS this window
         edits never is, so a rule that breaks the panel cannot hide the editor. -->
    <link rel="stylesheet" href="/assets/fa/css/all.min.css?v={{ASSET_STAMP}}" />
    <link rel="stylesheet" href="/assets/theme.css?v={{ASSET_STAMP}}" />
    <link rel="stylesheet" href="/assets/codemirror/codemirror.css?v={{ASSET_STAMP}}" />
    <script src="/assets/codemirror/codemirror.js?v={{ASSET_STAMP}}"></script>
    <script>
        try {
            const hue = localStorage.getItem("fern_accent_hue");
            if (hue !== null) document.documentElement.style.setProperty("--hue", hue);
            if (localStorage.getItem("fern_neutral") === "1") document.documentElement.style.setProperty("--tint", "0");
        } catch (e) { }
    </script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
        }

        .ed-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-tile {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border-radius: 10px;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
        }

        .titles {
            flex: 1;
            min-width: 0;
        }

        .titles h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 650;
        }

        .titles p {
            margin: 0;
            color: var(--text-desc);
            font-size: 11.5px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-input);
            border: 1px solid var(--border-default);
        }

        .pill::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }

        .pill.editing::before {
            background: var(--amber);
        }

        .pill.error::before {
            background: var(--red);
        }

        .editor {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: var(--bg-input);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            transition: border-color .15s;
        }

        .editor:focus-within {
            border-color: var(--accent-border);
        }

        .foot {
            justify-content: space-between;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            color: var(--text-dim);
            font-size: 11px;
        }

        kbd {
            padding: 1px 5px;
            border-radius: 4px;
            font: 10.5px "Cascadia Mono", Consolas, monospace;
            color: var(--text-muted);
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
        }

        .actions {
            display: flex;
            flex: 0 0 auto;
            gap: 8px;
        }

        /* ---- CodeMirror, themed from the panel's tokens ---- */
        .CodeMirror {
            height: 100%;
            font: 12.5px/1.6 "Cascadia Mono", Consolas, ui-monospace, monospace;
        }

        .cm-s-fern.CodeMirror {
            color: var(--text-primary);
            background: transparent;
        }

        .cm-s-fern .CodeMirror-gutters {
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
        }

        .cm-s-fern .CodeMirror-linenumber {
            padding: 0 10px 0 8px;
            color: var(--text-faint);
        }

        .cm-s-fern .CodeMirror-lines {
            padding: 10px 0;
        }

        .cm-s-fern .CodeMirror-cursor {
            border-left: 2px solid var(--accent);
        }

        .cm-s-fern .CodeMirror-activeline-background {
            background: var(--bg-hover-1);
        }

        .cm-s-fern .CodeMirror-activeline-gutter .CodeMirror-linenumber {
            color: var(--text-muted);
        }

        .cm-s-fern .CodeMirror-selected,
        .cm-s-fern.CodeMirror-focused .CodeMirror-selected {
            background: var(--accent-soft);
        }

        .cm-s-fern .CodeMirror-line::selection,
        .cm-s-fern .CodeMirror-line>span::selection,
        .cm-s-fern .CodeMirror-line>span>span::selection {
            background: var(--accent-soft);
        }

        .cm-s-fern .CodeMirror-matchingbracket {
            color: var(--accent-light) !important;
            outline: 1px solid var(--accent-border);
        }

        .cm-s-fern .CodeMirror-nonmatchingbracket {
            color: var(--red) !important;
        }

        /* Outranks CodeMirror's ".CodeMirror pre.CodeMirror-line-like", which
           would otherwise make the placeholder inherit the normal text colour. */
        .cm-s-fern.CodeMirror pre.CodeMirror-placeholder {
            color: var(--text-faint);
            font-style: italic;
        }

        .cm-s-fern .cm-tag,
        .cm-s-fern .cm-qualifier,
        .cm-s-fern .cm-builtin {
            color: var(--accent);
        }

        .cm-s-fern .cm-property {
            color: hsl(calc(var(--hue) + 160) calc(55% * var(--tint)) 72%);
        }

        .cm-s-fern .cm-atom,
        .cm-s-fern .cm-variable-2,
        .cm-s-fern .cm-variable-3 {
            color: var(--text-secondary);
        }

        .cm-s-fern .cm-number {
            color: var(--amber);
        }

        .cm-s-fern .cm-string,
        .cm-s-fern .cm-string-2 {
            color: var(--green);
        }

        .cm-s-fern .cm-keyword {
            color: var(--red);
        }

        .cm-s-fern .cm-def,
        .cm-s-fern .cm-variable {
            color: var(--accent-light);
        }

        .cm-s-fern .cm-comment {
            color: var(--text-faint);
            font-style: italic;
        }

        .cm-s-fern .cm-error {
            color: var(--red);
            text-decoration: underline wavy;
        }

        /* Suggestions and the find bar */
        .CodeMirror-hints {
            padding: 4px;
            font: 12px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace;
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
        }

        .CodeMirror-hint {
            padding: 2px 8px;
            border-radius: 5px;
            color: var(--text-secondary);
        }

        .CodeMirror-hint.fern-hint {
            color: var(--accent);
        }

        li.CodeMirror-hint-active,
        li.CodeMirror-hint-active.fern-hint {
            color: var(--text-primary);
            background: var(--accent-fill);
        }

        .cm-s-fern .CodeMirror-dialog {
            padding: 6px 10px;
            color: var(--text-muted);
            background: var(--bg-surface);
        }

        .cm-s-fern .CodeMirror-dialog-top {
            border-bottom: 1px solid var(--border-default);
        }

        .cm-s-fern .CodeMirror-dialog input {
            width: 16em;
            color: var(--text-primary);
            font-family: inherit;
        }

        .cm-s-fern .cm-searching {
            background: hsl(45 90% 50% / .3);
        }
    </style>
</head>

<body>
    <div class="ed-bar">
        <div class="icon-tile"><i class="fa fa-code" aria-hidden="true"></i></div>
        <div class="titles">
            <h1>Custom CSS</h1>
            <p>Applied to the panel as you type, after the theme</p>
        </div>
        <span class="pill" id="status">Saved</span>
    </div>

    <div class="editor" id="editor"></div>

    <div class="ed-bar foot">
        <div class="keys" title="Sublime Text keybinds. Ctrl+Shift+Alt+C in the panel clears all custom CSS.">
            <span><kbd>Ctrl</kbd> <kbd>Space</kbd> suggest</span>
            <span><kbd>Ctrl</kbd> <kbd>/</kbd> comment</span>
            <span><kbd>Ctrl</kbd> <kbd>D</kbd> next match</span>
            <span><kbd>Alt</kbd> <kbd>↑</kbd><kbd>↓</kbd> move line</span>
            <span><kbd>Ctrl</kbd> <kbd>F</kbd> find</span>
        </div>
        <div class="actions">
            <button class="btn ghost" type="button" id="clear">Clear</button>
            <button class="btn" type="button" id="done">Done</button>
        </div>
    </div>

    <script>
        "use strict";
        // The panel listens for changes to this key and applies them live.
        const KEY = "fern_custom_css";
        const status = document.getElementById("status");

        function setStatus(text, kind) {
            status.textContent = text;
            status.className = "pill" + (kind ? " " + kind : "");
        }

        let initial = "";
        try { initial = localStorage.getItem(KEY) || ""; } catch (e) { }

        // CSS has no line comments, so CodeMirror's toggle wraps the whole line
        // including its indent. Comment each selected line after its indent
        // instead, the way VS Code does, and uncomment when all already are.
        function toggleLineComments(ed) {
            const lines = new Set();
            ed.listSelections().forEach((range) => {
                const from = Math.min(range.anchor.line, range.head.line);
                const to = Math.max(range.anchor.line, range.head.line);
                for (let line = from; line <= to; line++) lines.add(line);
            });
            const targets = [...lines].filter((line) => ed.getLine(line).trim());
            if (!targets.length) return;
            const isCommented = (text) => /^\s*\/\*.*\*\/\s*$/.test(text);
            const uncomment = targets.every((line) => isCommented(ed.getLine(line)));
            ed.operation(() => targets.forEach((line) => {
                const text = ed.getLine(line);
                const indent = text.match(/^\s*/)[0];
                const body = text.slice(indent.length).trimEnd();
                const next = uncomment
                    ? body.replace(/^\/\*\s?/, "").replace(/\s?\*\/$/, "")
                    : "/* " + body + " */";
                ed.replaceRange(indent + next, { line, ch: 0 }, { line, ch: text.length });
            }));
        }

        /* ---- Suggestions for Fern's own classes and ids ----
           Collected from the panel's markup and theme, so typing ".c" in a
           selector offers .card, .chat-preview and the rest. */
        const fernNames = { ".": new Set(), "#": new Set() };

        function collectFromMarkup(html) {
            const doc = new DOMParser().parseFromString(html, "text/html");
            // Font Awesome's per-icon classes (fa-clock, fa-music, ...) would bury the rest.
            doc.querySelectorAll("[class]").forEach((el) => el.classList.forEach((c) => {
                if (!c.startsWith("fa-")) fernNames["."].add(c);
            }));
            doc.querySelectorAll("[id]").forEach((el) => fernNames["#"].add(el.id));
            // Classes the script adds at runtime (row, toast, log-line, ...).
            doc.querySelectorAll("script").forEach((script) => {
                for (const m of script.textContent.matchAll(/className\s*=\s*"([\w\s-]+)"/g)) {
                    m[1].split(/\s+/).forEach((c) => c && fernNames["."].add(c));
                }
            });
        }

        function collectFromTheme() {
            for (const sheet of document.styleSheets) {
                if (!sheet.href || !sheet.href.includes("/assets/theme.css")) continue;
                let rules;
                try { rules = sheet.cssRules; } catch (e) { continue; }
                const walk = (list) => {
                    for (const rule of list) {
                        if (rule.cssRules) walk(rule.cssRules);
                        if (!rule.selectorText) continue;
                        for (const m of rule.selectorText.matchAll(/([.#])([a-zA-Z_][\w-]*)/g)) fernNames[m[1]].add(m[2]);
                    }
                };
                walk(rules);
            }
        }

        collectFromTheme();
        fetch("/").then((res) => res.text()).then(collectFromMarkup).catch(() => { });

        // True when the cursor is in a selector rather than inside a { } block.
        function inSelector(ed) {
            const state = ed.getTokenAt(ed.getCursor()).state;
            const mode = state && state.state;
            return mode === "top" || mode === "pseudo";
        }

        function fernHint(ed, options) {
            const cur = ed.getCursor();
            const m = /([.#])([\w-]*)$/.exec(ed.getLine(cur.line).slice(0, cur.ch));
            if (m && inSelector(ed)) {
                const [whole, prefix, typed] = m;
                const list = [...fernNames[prefix]]
                    .filter((name) => name.startsWith(typed) && name !== typed)
                    .sort()
                    .map((name) => ({ text: prefix + name, className: "fern-hint" }));
                return { list, from: CodeMirror.Pos(cur.line, cur.ch - whole.length), to: cur };
            }
            return CodeMirror.hint.css(ed, options);
        }

        const cm = CodeMirror(document.getElementById("editor"), {
            value: initial,
            mode: "css",
            theme: "fern",
            keyMap: "sublime",
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            autoCloseBrackets: true,
            matchBrackets: true,
            styleActiveLine: true,
            autofocus: true,
            placeholder: ".card { border-radius: 6px; }",
            hintOptions: { hint: fernHint, completeSingle: false },
            extraKeys: {
                "Ctrl-Space": "autocomplete",
                "Ctrl-/": toggleLineComments,
                "Ctrl-S": () => { clearTimeout(timer); save(); },
                "Alt-Up": "swapLineUp",
                "Alt-Down": "swapLineDown",
                "Shift-Alt-Down": "duplicateLine",
                "Shift-Tab": "indentLess",
                // Indent a selection; otherwise insert spaces rather than a tab.
                "Tab": (ed) => {
                    if (ed.somethingSelected()) ed.indentSelection("add");
                    else ed.replaceSelection(" ".repeat(ed.getOption("indentUnit")), "end");
                },
            },
        });

        // Suggest as you type a property or value name, not only on Ctrl+Space.
        // Suggest as you type a property, value, class or id, not only on Ctrl+Space.
        cm.on("inputRead", (ed, change) => {
            if (change.origin !== "+input" || ed.state.completionActive) return;
            const ch = change.text[0];
            if (/^[a-zA-Z-]$/.test(ch) || ((ch === "." || ch === "#") && inSelector(ed))) ed.showHint();
        });

        function save() {
            timer = null;
            try {
                localStorage.setItem(KEY, cm.getValue());
                setStatus("Saved");
            } catch (e) {
                setStatus("Storage is full", "error");
            }
        }

        let timer = null;
        // setValue from the storage listener below must not echo back as an edit.
        let applyingRemote = false;
        cm.on("change", () => {
            if (applyingRemote) return;
            setStatus("Editing", "editing");
            clearTimeout(timer);
            timer = setTimeout(save, 250);
        });

        document.getElementById("clear").addEventListener("click", () => {
            if (cm.getValue() && !confirm("Clear all custom CSS?")) return;
            cm.setValue("");
            clearTimeout(timer);
            save();
            cm.focus();
        });

        document.getElementById("done").addEventListener("click", () => {
            clearTimeout(timer);
            save();
            // A native editor window is closed by the app; a browser popup by itself.
            if (typeof window.fernCloseEditor === "function") window.fernCloseEditor();
            else window.close();
        });

        // The panel can clear the CSS too; keep this window in step.
        window.addEventListener("storage", (ev) => {
            if (ev.key !== KEY || ev.newValue === cm.getValue()) return;
            applyingRemote = true;
            cm.setValue(ev.newValue || "");
            applyingRemote = false;
        });

        // Flush a pending save when focus leaves (say, back to the panel) or the
        // window closes, instead of waiting out the typing delay.
        const flush = () => {
            if (!timer) return;
            clearTimeout(timer);
            save();
        };
        window.addEventListener("blur", flush);
        window.addEventListener("beforeunload", flush);
    </script>
</body>

</html>
